name: Bug report
description: Report a reproducible AgentMop problem without sharing private session content.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AgentMop. **Do not attach raw agent sessions, prompts, credentials, or proprietary paths.** Prefer `agentmop scan --json` after manually reviewing and redacting it.
  - type: input
    id: version
    attributes:
      label: AgentMop version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, Windows, WSL, Other]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and minimal reproduction
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I reviewed the report and removed prompts, secrets, usernames, and proprietary paths.
          required: true
